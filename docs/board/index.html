<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小組討論回報</title>
<style>
:root{--navy:#1f3a68;--blue:#2f7fd0;--orange:#f0a030}
*{box-sizing:border-box}body{margin:0;background:#f4f8fc;font:18px/1.5 "Noto Sans TC",system-ui,sans-serif;color:#222}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{color:var(--navy);font-size:24px;margin:4px 0 16px}
.step{font-weight:700;color:var(--navy);margin:14px 0 6px}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g button,.qs button{font-weight:900;font-size:19px;padding:12px 4px;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);line-height:1.3}
.qs button small{display:block;font-weight:500;font-size:14px;color:inherit;opacity:.8}
.g button.on,.qs button.on{background:var(--navy);color:#fff}
textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid #b8c8de;border-radius:12px}
#free{min-height:180px}
.f{margin-bottom:12px}.f label{display:block;font-weight:900;color:var(--navy)}
.f label span{font-weight:500;font-size:15px;color:#667;margin-left:6px}
.f textarea{min-height:64px}
.case{background:#fff7e8;border-left:5px solid var(--orange);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:16px}
.how{background:#eaf2fc;border-left:5px solid var(--blue);padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:16px}
.how b{color:var(--navy)}
.f .ask{font-size:16px;color:#333;margin:2px 0 4px}
details.ex{font-size:15px;color:#555;margin:4px 0 0}details.ex summary{color:var(--blue);font-weight:700;cursor:pointer}
details.ex p{margin:4px 0 0;background:#fff;border:1px dashed #b8c8de;border-radius:8px;padding:6px 10px}
.pre{font-size:15px;color:#667}
#send{width:100%;margin-top:6px;padding:14px;font-weight:900;font-size:22px;border:0;border-radius:12px;background:var(--orange);color:#fff}
#send:disabled{opacity:.5}#clear{width:100%;margin-top:10px;padding:10px;font-weight:700;font-size:16px;border:2px solid #c0392b;border-radius:12px;background:#fff;color:#c0392b}#msg{margin-top:10px;min-height:1.5em;font-weight:700}
.ok{color:#178a3b}.err{color:#c0392b}small.note{color:#777}
</style></head><body><main>
<h1>📝 小組討論回報</h1>
<div class="step">1. 選你們的組別</div>
<div class="g" id="g"></div>
<div class="step">2. 選討論主題（看簡報上寫第幾題）</div>
<div class="qs" id="q"></div>
<div class="step">3. 寫下討論結果 <small class="note">（再按儲存會<b>取代</b>之前的版本）</small></div>
<div id="area"><small class="note">先選組別和主題</small></div>
<button id="send">💾 儲存到簡報</button>
<button id="clear">🗑 清除這組在這個主題的內容</button>
<div id="msg"></div>
<small class="note">請勿填寫學生姓名等個資。</small>
</main><script>
const TOPIC='coplan1113-03609635c2';let grp=0,qn=0;
// 主題 1＝一格自由填；主題 2～4＝「小組產出」四格（簡報 p35 那張表的欄位）
const QS={1:['案例① 第3題','重新設計搜尋課'],2:['案例④','生圖海報'],3:['案例⑤','Scratch 除錯'],4:['案例⑥','作文／例句'],5:['破冰','學生用 AI 做作業的有趣現象']};
const CASE={2:'學生要完成「未來的智慧校園」海報，有人直接用 AI 生成整張，有人先畫草圖再請 AI 協助。',
  3:'角色碰到敵人後生命值要減 1，學生卡住就問 AI。全班 30 份作品最後都會動。',
  4:'語文老師：五年級學生作文寫不出來，想讓他們問 AI 幫忙，又怕直接複製。'};
// 前兩格依案例預先填好（可改），各組只要想後兩格
const PRE={2:['完成「未來的智慧校園」海報','直接生成整張海報（構圖、配色、圖像）'],
  3:['完成一個 Scratch 遊戲（碰到敵人生命值減 1）','直接寫出完整程式、幫忙除錯'],
  4:['寫一篇作文','給範文、例句，甚至整篇寫好']};
// 每個主題的引導：這題怎麼想、後兩格各問什麼、參考例子（收合，想不出來再點開）
const GUIDE={
 1:{how:'<b>這題怎麼想：</b>先寫一個 AI 時代更需要的能力，再寫一個「看得到」這個能力的作業。',
    ph:'① 更重要的能力：（例：判斷資料來源）\n② 看得到它的作業：（例：在 AI 回答裡標出你查證過的一句，寫下查了哪裡）'},
 5:{how:'<b>破冰：</b>您有沒有讓學生使用 AI 完成課堂上的作業？遇到了什麼有趣的現象？組內挑一個最有趣的寫下來。',
    ph:'例：學生請 AI 寫心得，結果每個人的開頭都一模一樣…（請勿寫學生姓名）'},
 2:{how:'<b>改造法②「保留前後差異」：</b>學生先自己做初稿 → 再請 AI 協助 → 自己選擇、修改成最終稿。前後版本都交，老師就看得到學生自己做了哪些決定。',
    ask:['學生要交哪幾個版本？再加寫一句什麼？','老師拿到 30 份海報，眼睛先看哪裡？'],
    ex:['先畫的草圖、AI 版、最終版三張並排，加一句「我最後改了＿＿，因為＿＿」。','①最終版的構圖是不是來自草圖（沒有整張被 AI 換掉）？②那句理由有沒有講到設計（例如標題太小所以放大），不是只寫「比較好看」？兩項都不行的，才請他當場說明。']},
 3:{how:'<b>改造法③「完成後改一題」：</b>作品完成後，老師改一個條件，請學生自己改程式。真的懂的人很快就改得出來。',
    ask:['老師要改哪一個條件？','怎麼一次看完全班？'],
    ex:['生命值 3 → 5，或碰到敵人扣 1 → 扣 2，請學生當場自己改。','全班同時改 1 分鐘，老師巡一圈看誰改得出來；改不出來的才個別問「你覺得要改哪裡？」。']},
 4:{how:'<b>改造法①「成品＋一個關鍵問題」：</b>作文照樣交，只多問一題 AI 沒辦法替學生回答的問題。',
    ask:['要多問學生哪一題？','老師批閱時，怎麼不讓工作量暴增？'],
    ex:['「AI 給的例句裡，你沒採用哪一句？為什麼？」','先只看這一題的回答；說不出理由的，才回頭細看他的作文。']}};
const F=[['原本作業','學生原本要做什麼？'],['AI 可能代做','AI 可以直接完成哪一部分？'],['新增一個證據','只加一個：要學生留下什麼，才看得見學習？'],['快速判讀','老師用什麼方式，30 個學生也能快速看出來？']];
const $=id=>document.getElementById(id),q=$('q'),g=$('g'),area=$('area'),b=$('send'),m=$('msg');
try{grp=+localStorage.getItem('grp')||0}catch(e){}
for(let i=1;i<=5;i++){const x=document.createElement('button');x.textContent='第'+i+'組';x.onclick=()=>{grp=i;try{localStorage.setItem('grp',i)}catch(e){}draw();load()};g.appendChild(x)}
for(const i of Object.keys(QS)){const x=document.createElement('button');x.dataset.q=i;x.innerHTML='主題 '+i+'<small>'+QS[i][0]+'・'+QS[i][1]+'</small>';x.onclick=()=>{qn=+i;draw();load()};q.appendChild(x)}
function draw(){[...g.children].forEach((x,i)=>x.classList.toggle('on',i+1===grp));[...q.children].forEach(x=>x.classList.toggle('on',+x.dataset.q===qn))}draw();
const four=()=>qn>=2&&qn<=4;
function build(text){
  const G=GUIDE[qn]||{};
  if(!four()){area.innerHTML=(G.how?'<div class="how">'+G.how+'</div>':'')+'<textarea id="free" maxlength="600"></textarea>';$('free').placeholder=G.ph||'例如：我們這組認為…';$('free').value=text||'';}
  else{area.innerHTML='<div class="case"><b>情境：</b>'+CASE[qn]+'</div><div class="how">'+G.how+'</div>'+F.map((f,i)=>i<2
      ?`<div class="f"><label>${f[0]}<span>已幫你填好，可改</span></label><textarea id="f${i}" class="pre" maxlength="200"></textarea></div>`
      :`<div class="f"><label>${f[0]}</label><div class="ask">👉 ${G.ask[i-2]}</div><textarea id="f${i}" maxlength="200"></textarea><details class="ex"><summary>💡 想不出來？看一個例子</summary><p>${G.ex[i-2]}</p></details></div>`).join('');
    // 讀回舊版：依「欄名：」切回四格；切不出來就整段放第一格
    const parts=text?parse(text):[...PRE[qn],'',''];F.forEach((f,i)=>$('f'+i).value=parts[i]||'');}
  area.querySelectorAll('textarea').forEach(x=>x.oninput=()=>dirty=true);}
function parse(s){const out=['','','',''];if(!s)return out;let hit=false;
  F.forEach((f,i)=>{const re=new RegExp('【'+f[0]+'】([\\s\\S]*?)(?=\\n?【|$)');const r=s.match(re);if(r){out[i]=r[1].trim().replace(/^（未填）$/,'');hit=true}});
  if(!hit)out[0]=s;return out;}
function collect(){if(!four())return $('free').value.trim();
  const v=F.map((f,i)=>$('f'+i).value.trim());if(!v[2])return '';
  return F.map((f,i)=>'【'+f[0]+'】'+(v[i]||'（未填）')).join('\n');}
// 選好主題＋組別 → 帶出這組目前的版本來編輯（同組誰最後儲存就以誰為準）
let dirty=false;
async function load(){if(!qn||!grp)return;const want=qn+'-'+grp;
  if(dirty&&!confirm('畫面上還沒儲存的內容會被換掉，確定？'))return;
  build('');dirty=false;m.className='';m.textContent='讀取這組目前的內容…';
  try{const r=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1&since=all');const lines=(await r.text()).trim().split('\n');let last=null;
    const day0=new Date().setHours(0,0,0,0)/1000;
    for(const l of lines){try{const ev=JSON.parse(l);if(ev.time<day0)continue;const d=JSON.parse(ev.message);if(+d.q===qn&&+d.g===grp)last=d}catch(e){}}
    if(last&&!last.t)last=null;if(qn+'-'+grp!==want)return;build(last?last.t:'');dirty=false;m.textContent=last?'已載入第'+grp+'組目前的版本，可直接修改後儲存':'這組在主題'+qn+'還沒有內容';}
  catch(e){m.className='err';m.textContent='讀取失敗（可直接輸入）';}}
b.onclick=async()=>{if(!grp){m.className='err';m.textContent='請先選組別';return}if(!qn){m.className='err';m.textContent='請先選主題';return}
const s=collect();if(!s){m.className='err';m.textContent=four()?'請先填「新增一個證據」':'請先輸入內容';return}
b.disabled=true;m.className='';m.textContent='送出中…';
try{const r=await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:JSON.stringify({q:qn,g:grp,t:s})});if(!r.ok)throw r.status;
dirty=false;m.className='ok';m.textContent='✅ 已儲存（主題'+qn+'・第'+grp+'組），簡報上已更新';}catch(e){m.className='err';m.textContent='送出失敗，請再試一次（'+e+'）'}b.disabled=false};
$('clear').onclick=async()=>{if(!grp||!qn){m.className='err';m.textContent='請先選組別和主題';return}
if(!confirm('確定清除第'+grp+'組在主題'+qn+'的內容？簡報上也會一起清掉。'))return;
try{const r=await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:JSON.stringify({q:qn,g:grp,t:'',del:1})});if(!r.ok)throw r.status;
dirty=false;build('');m.className='ok';m.textContent='🗑 已清除（主題'+qn+'・第'+grp+'組）';}catch(e){m.className='err';m.textContent='清除失敗，請再試一次（'+e+'）'}};
</script></body></html>
